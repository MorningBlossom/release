apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-code-review
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-code-review

  template:
    metadata:
      labels:
        app: ai-code-review

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: ai-code-review
          image: ai-code-review-image
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          envFrom:
            - secretRef:
                name: ai-code-review-secret

          volumeMounts:
            - name: github-private-key
              mountPath: /app/private-key.pem
              subPath: private-key.pem
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30

      volumes:
        - name: github-private-key
          secret:
            secretName: ai-code-review-secret
            items:
              - key: private-key.pem
                path: private-key.pem