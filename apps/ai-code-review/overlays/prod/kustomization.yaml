apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

images:
  - name: ai-code-review-image
    newName: ghcr.io/morningblossom/ai-code-review
    newTag: latest

secretGenerator:
  - name: ai-code-review-secret
    envs:
      - secret.env
    files:
      - private-key.pem

generatorOptions:
  disableNameSuffixHash: true
