apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: production
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:latest

          ports:
            - containerPort: 11434

          resources:
            requests:
              cpu: "250m"
              memory: "4Gi"
            limits:
              cpu: "1"
              memory: "6Gi"

          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama

          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30

      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data